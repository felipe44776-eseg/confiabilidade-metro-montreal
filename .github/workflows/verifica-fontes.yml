# Toda semana, baixa de novo cada fonte na origem e compara com a cópia da Release.
# Mudança na origem é aviso, não erro: vale o snapshot da Release (spec 000).
name: Verificar fontes na origem

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Baixar a Release, comparar com a origem e recalcular
        shell: bash
        run: |
          dia=$(date -u +%Y-%m-%d)
          python -I pipeline/verifica_fontes.py --baixa-release --online --recalcula | tee "fontes/verificacao/online_${dia}.txt"

      - name: Registrar o relatório no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fontes/verificacao/
          if git diff --cached --quiet; then
            echo "nada a registrar"
          else
            git commit -m "Verificação semanal das fontes ($(date -u +%Y-%m-%d))"
            git push
          fi
