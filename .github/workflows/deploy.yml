# Publica o site no GitHub Pages. Só publica se a verificação das fontes passar (constituição, princípio 15).
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verificar fontes (baixa a Release, confere hashes e recalcula números)
        shell: bash
        run: |
          mkdir -p _verificacao
          python -I pipeline/verifica_fontes.py --baixa-release --recalcula | tee _verificacao/relatorio.txt

      - name: Testar e construir o app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build

      - name: Montar o site
        run: python -I publicacao/monta_site.py --relatorio _verificacao/relatorio.txt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
